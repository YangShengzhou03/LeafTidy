[package]
name = "leaf-tidy"
version = "1.0.0"
description = "一站式全域文件治理与数字化资产规整工具"
authors = ["Yangshengzhou"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kamadak-exif = "0.5"
walkdir = "2"
rayon = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
md-5 = "0.10"
trash = "3"
log = "0.4"
env_logger = "0.11"
ort = { version = "2.0.0-rc.13", features = ["std", "ndarray", "copy-dylibs"] }
image = "0"
ndarray = "0"

[package.metadata]
tauri = {}

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
